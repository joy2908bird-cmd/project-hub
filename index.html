<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ 專案指揮中心</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0f1e;color:#f1f5f9;font-family:'DM Sans','Noto Sans TC',sans-serif;min-height:100vh}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
  input::placeholder,textarea::placeholder{color:#475569}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  #app{display:flex;flex-direction:column;min-height:100vh}
  header{padding:14px 22px;border-bottom:1px solid #1e293b;background:#0d1526;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .logo{font-size:17px;font-weight:800;color:#fff}
  .logo-sub{font-size:11px;color:#64748b;margin-top:2px}
  nav{display:flex;gap:5px;flex-wrap:wrap}
  .nb{padding:7px 13px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:#64748b;transition:all .15s}
  .nb.active{background:#6366f1;color:#fff}
  .body{display:flex;flex:1;overflow:hidden;height:calc(100vh - 58px)}
  .sidebar{width:250px;border-right:1px solid #1e293b;background:#0d1526;overflow-y:auto;padding:14px 10px;flex-shrink:0}
  .main{flex:1;overflow-y:auto;padding:22px}
  .sec-title{font-size:11px;font-weight:700;color:#64748b;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
  .proj-card{padding:11px 13px;border-radius:10px;cursor:pointer;margin-bottom:6px;transition:all .15s;border:1px solid transparent}
  .proj-card:hover{background:#1e293b44}
  .card{background:#0d1526;border:1px solid #1e293b;border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .inp{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:9px 12px;color:#f1f5f9;font-size:13.5px;outline:none;width:100%;font-family:inherit}
  .inp:focus{border-color:#6366f1}
  .btn{padding:9px 16px;border-radius:8px;color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;font-family:inherit;transition:all .15s}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center}
  .badge{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
  .tag-pill{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .progress-bar{height:3px;background:#1e293b;border-radius:99px;overflow:hidden;margin:5px 0 4px 14px}
  .progress-fill{height:100%;border-radius:99px}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .todo-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #1e293b}
  .idea-item{padding:8px 12px;background:#1e293b;border-radius:8px;margin-bottom:6px}
  .chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .bubble{max-width:82%;padding:10px 14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
  .bubble.user{border-radius:18px 18px 4px 18px;background:#6366f1;color:#fff;align-self:flex-end}
  .bubble.ai{border-radius:18px 18px 18px 4px;background:#1e293b;color:#f1f5f9;border:1px solid #334155;align-self:flex-start}
  .chat-input-row{padding:12px 16px;border-top:1px solid #1e293b;display:flex;gap:8px}
  .dots{display:flex;gap:4px;padding:8px 14px}
  .dot-bounce{width:6px;height:6px;border-radius:50%;background:#6366f1}
  .modal-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:999}
  .modal{background:#0d1526;border:1px solid #334155;border-radius:16px;padding:26px;width:360px;max-width:92vw}
  .save-bar{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;text-align:center;padding:20px}
  .spinner{width:32px;height:32px;border:3px solid #1e293b;border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite}
  .toast{position:fixed;bottom:24px;right:24px;background:#10b981;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;animation:fadeIn .2s ease}
  .analysis-card{background:#0d1526;border:1px solid #6366f155;border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .bottom-nav{display:none}
  @media(max-width:700px){
    .sidebar{display:none}
    .main{padding:14px;padding-bottom:80px}
    .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0d1526;border-top:1px solid #1e293b;z-index:100;padding:8px 0}
    .bottom-nav button{flex:1;background:none;border:none;color:#64748b;font-size:11px;font-weight:600;cursor:pointer;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
    .bottom-nav button.active{color:#6366f1}
    .bnav-icon{font-size:20px}
    header{padding:12px 16px}
    nav{display:none}
    .card{padding:14px 16px}
    .modal{width:92vw}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = 'https://jolly-glitter-1f89.joy2908bird.workers.dev';
const GEMINI_KEY = 'AIzaSyB4UNKxRgdyvkm0tF0kO5R_jsMtZGEMpKY';
const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + GEMINI_KEY;

const STATUS = {
  active:{label:'進行中',color:'#10b981'},
  paused:{label:'暫停',color:'#f59e0b'},
  done:{label:'完成',color:'#6366f1'},
  idea:{label:'構想中',color:'#94a3b8'},
};
const PRI_LABEL = {high:'高',medium:'中',low:'低'};
const PRI_COLOR = {high:'#ef4444',medium:'#f59e0b',low:'#64748b'};
const H = {'Content-Type':'application/json'};

// API
async function sbGet(t){ const r=await fetch(API+'/'+t,{headers:H}); return r.json(); }
async function sbPost(t,b){ const r=await fetch(API+'/'+t,{method:'POST',headers:H,body:JSON.stringify(b)}); return r.json(); }
async function sbPatch(t,id,b){ const r=await fetch(API+'/'+t+'/'+id,{method:'PATCH',headers:H,body:JSON.stringify(b)}); return r.json(); }

// State
let S = {
  projects:[],todos:[],ideas:[],
  loading:true,saving:false,error:null,
  selectedId:null,view:'board',aiProjectId:null,
  localTodos:{},dirtyTodos:{},
  newTodoText:'',newIdeaText:'',globalText:'',
  showNewProj:false,newProj:{name:'',subtitle:'',tags:'',color:'#6366f1'},
  chatMessages:[],chatInput:'',chatLoading:false,
  ideaAnalyzing:false,ideaAnalysis:null,editingIdeaId:null,editingIdeaText:'',
};

function set(p){ Object.assign(S,typeof p==='function'?p(S):p); render(); }

function showToast(msg,color){
  const t=document.createElement('div');
  t.className='toast';
  if(color) t.style.background=color;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

// Data helpers
function getProjectTodos(pid){
  return S.todos.filter(t=>t.project_id===pid).map(t=>({
    ...t,
    done: S.dirtyTodos[t.id]!==undefined ? S.localTodos[t.id] : (t.done===1||t.done===true),
    isDirty: S.dirtyTodos[t.id]!==undefined,
  }));
}
function getProjectIdeas(pid){ return S.ideas.filter(i=>i.project_id===pid); }
function getGlobalIdeas(){ return S.ideas.filter(i=>!i.project_id); }
function hasDirty(){ return Object.keys(S.dirtyTodos).length>0; }

// Load
async function loadData(){
  set({loading:true,error:null});
  try {
    const [projects,todos,ideas] = await Promise.all([sbGet('projects'),sbGet('todos'),sbGet('ideas')]);
    set({loading:false,projects,todos,ideas,
      selectedId:S.selectedId||(projects[0]&&projects[0].id),
      localTodos:{},dirtyTodos:{},
    });
  } catch(e){ set({loading:false,error:e.message}); }
}

// Write
async function saveTodos(){
  if(!hasDirty()) return;
  set({saving:true});
  const ids=Object.keys(S.dirtyTodos);
  await Promise.all(ids.map(id=>sbPatch('todos',id,{done:S.localTodos[id]})));
  await loadData();
  set({saving:false});
  showToast('已儲存');
}
async function addTodo(projectId,content){
  if(!content.trim()) return;
  set({saving:true});
  await sbPost('todos',{id:'t'+Date.now(),project_id:projectId,content:content.trim(),priority:'medium',done:false});
  await loadData();
  set({saving:false,newTodoText:''});
  showToast('任務已新增');
}
async function addIdea(projectId,content){
  if(!content||!content.trim()) return;
  set({saving:true});
  await sbPost('ideas',{id:'i'+Date.now(),project_id:projectId||null,content:content.trim()});
  await loadData();
  set({saving:false,newIdeaText:'',globalText:''});
  showToast('靈感已記錄');
}
async function deleteIdea(id){
  set({saving:true});
  await fetch(API+'/ideas/'+id,{method:'DELETE',headers:H});
  await loadData();
  set({saving:false});
  showToast('已刪除');
}

async function updateIdea(id,content){
  if(!content||!content.trim()) return;
  set({saving:true});
  await fetch(API+'/ideas/'+id,{method:'PATCH',headers:H,body:JSON.stringify({content:content.trim()})});
  await loadData();
  set({saving:false,editingIdeaId:null,editingIdeaText:''});
  showToast('靈感已更新');
}

async function updateProject(id,patch){
  set({saving:true});
  await sbPatch('projects',id,patch);
  await loadData();
  set({saving:false});
}
async function addProject(data){
  set({saving:true});
  const r = await sbPost('projects',{id:'proj'+Date.now(),...data});
  await loadData();
  set({saving:false,showNewProj:false,newProj:{name:'',subtitle:'',tags:'',color:'#6366f1'}});
  showToast('專案已建立');
  return r;
}

// Gemini AI chat
async function sendChat(){
  const input=S.chatInput.trim();
  if(!input||S.chatLoading) return;
  const project=S.projects.find(p=>p.id===S.aiProjectId);
  const todos=project?getProjectTodos(project.id):[];
  const msgs=[...S.chatMessages,{role:'user',text:input}];
  set({chatMessages:msgs,chatInput:'',chatLoading:true});
  const sysPrompt = project
    ? '你是專業技術專案助理。專案：「'+project.name+'」'+project.subtitle+'\n技術：'+project.tags+' | 進度：'+project.progress+'% | 狀態：'+(STATUS[project.status]&&STATUS[project.status].label)+'\n未完成任務：\n'+todos.filter(function(t){return !t.done;}).map(function(t){return '- ['+t.priority+'] '+t.content;}).join('\n')+'\n請用繁體中文，具體實用地回答。'
    : '你是專業技術專案助理，協助管理：\n'+S.projects.map(function(p){return '• '+p.name+'（'+(STATUS[p.status]&&STATUS[p.status].label)+'，'+p.progress+'%）';}).join('\n')+'\n請用繁體中文回答。';
  const history=msgs.slice(-6).map(function(m){return {role:m.role==='assistant'?'model':'user',parts:[{text:m.text}]};});
  try {
    const res=await fetch(GEMINI_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system_instruction:{parts:[{text:sysPrompt}]},contents:history,generationConfig:{maxOutputTokens:1000,temperature:0.7}}),
    });
    const data=await res.json();
    const reply=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&data.candidates[0].content.parts[0].text)||'（無回應）';
    set({chatMessages:[...msgs,{role:'assistant',text:reply}],chatLoading:false});
  } catch(e){ set({chatMessages:[...msgs,{role:'assistant',text:'連線失敗：'+e.message}],chatLoading:false}); }
  setTimeout(function(){var el=document.getElementById('chat-bottom');if(el)el.scrollIntoView({behavior:'smooth'});},100);
}

// Gemini idea analysis
async function analyzeIdea(ideaText){
  if(!ideaText||!ideaText.trim()) return;
  await addIdea(null,ideaText);
  set({ideaAnalyzing:true,ideaAnalysis:null,globalText:''});
  var projectList=S.projects.map(function(p){return p.id+'|'+p.name+'|'+p.subtitle;}).join('; ');
  var prompt='現有專案：'+projectList+'\n\n新靈感：'+ideaText+'\n\n請只輸出一個JSON，格式如下（不要markdown，不要解釋）：{"summary":"總結","action":"new_project","reason":"原因","project_name":"名稱","project_subtitle":"副標題","project_tags":"tag1,tag2","project_color":"#6366f1","existing_project_id":"","suggested_todos":["任務1","任務2"]}\n\naction只能是new_project、add_to_existing、just_note其中一個。若是add_to_existing則填existing_project_id。';
  try {
    var res=await fetch(GEMINI_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{role:'user',parts:[{text:prompt}]}],
        generationConfig:{maxOutputTokens:600,temperature:0.3,responseMimeType:'application/json'}
      }),
    });
    var data=await res.json();
    var raw='';
    try{ raw=data.candidates[0].content.parts[0].text; }catch(e2){ raw=''; }
    if(!raw) throw new Error('Gemini 無回應');
    var clean=raw.replace(/```json/g,'').replace(/```/g,'').trim();
    var start=clean.indexOf('{');
    var end=clean.lastIndexOf('}');
    if(start===-1||end===-1) throw new Error('找不到JSON');
    var analysis=JSON.parse(clean.slice(start,end+1));
    set({ideaAnalyzing:false,ideaAnalysis:analysis});
  } catch(e){
    set({ideaAnalyzing:false,ideaAnalysis:{summary:'分析失敗，靈感已儲存',action:'just_note',reason:e.message}});
  }
}

async function createFromAnalysis(analysis){
  if(analysis.action==='new_project'){
    await addProject({name:analysis.project_name,subtitle:analysis.project_subtitle||'',tags:analysis.project_tags||'',color:analysis.project_color||'#6366f1',status:'active',progress:0});
    if(analysis.suggested_todos&&analysis.suggested_todos.length){
      await new Promise(function(r){setTimeout(r,800);});
      var newProj=S.projects.find(function(p){return p.name===analysis.project_name;});
      if(newProj){
        for(var i=0;i<analysis.suggested_todos.length;i++){
          await sbPost('todos',{id:'t'+Date.now(),project_id:newProj.id,content:analysis.suggested_todos[i],priority:'medium',done:false});
          await new Promise(function(r){setTimeout(r,200);});
        }
        await loadData();
      }
    }
    showToast('新專案已建立！');
  } else if(analysis.action==='add_to_existing'&&analysis.existing_project_id){
    if(analysis.suggested_todos&&analysis.suggested_todos.length){
      for(var j=0;j<analysis.suggested_todos.length;j++){
        await sbPost('todos',{id:'t'+Date.now(),project_id:analysis.existing_project_id,content:analysis.suggested_todos[j],priority:'medium',done:false});
        await new Promise(function(r){setTimeout(r,200);});
      }
      await loadData();
    }
    showToast('任務已加入專案！');
  }
  set({ideaAnalysis:null});
}

// DOM helpers
function el(tag,attrs){
  var e=document.createElement(tag);
  var kids=Array.prototype.slice.call(arguments,2);
  for(var k in attrs||{}){
    if(k==='style'&&typeof attrs[k]==='object') Object.assign(e.style,attrs[k]);
    else if(k==='cls') e.className=attrs[k];
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  function addKid(c){
    if(c==null||c===false) return;
    if(Array.isArray(c)){ c.forEach(addKid); return; }
    e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);
  }
  kids.forEach(addKid);
  return e;
}
function bdg(label,color){ return el('span',{cls:'badge',style:{background:color+'22',color:color,border:'1px solid '+color+'44'}},label); }
function pill(label,color){ return el('span',{cls:'tag-pill',style:{background:color+'22',color:color,border:'1px solid '+color+'44'}},label); }
function btn(label,bg,onClick,disabled){
  var b=el('button',{cls:'btn',style:{background:disabled?'#334155':bg}},label);
  if(disabled) b.disabled=true;
  else b.addEventListener('click',onClick);
  return b;
}

// Views
function renderBoard(){
  var projects=S.projects;
  var highPri=[];
  projects.forEach(function(p){
    getProjectTodos(p.id).filter(function(t){return !t.done&&t.priority==='high';}).forEach(function(t){
      highPri.push(Object.assign({},t,{pn:p.name,pc:p.color}));
    });
  });
  return el('div',{},
    el('div',{style:{fontSize:20,fontWeight:800,marginBottom:18,color:'#fff'}},'所有專案概覽'),
    el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:14,marginBottom:24}},
      projects.map(function(p){
        var pt=getProjectTodos(p.id);
        var card=el('div',{cls:'card',style:{borderLeft:'3px solid '+p.color,cursor:'pointer'}},
          el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}},
            el('div',{},
              el('div',{style:{fontSize:15,fontWeight:800,color:'#fff'}},p.name),
              el('div',{style:{fontSize:11,color:'#64748b',marginTop:2}},p.subtitle),
            ),
            bdg((STATUS[p.status]&&STATUS[p.status].label)||p.status,(STATUS[p.status]&&STATUS[p.status].color)||'#64748b'),
          ),
          el('div',{style:{marginBottom:10}},
            el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:11,color:'#94a3b8',marginBottom:4}},el('span',{},'進度'),el('span',{},p.progress+'%')),
            el('div',{style:{height:4,background:'#1e293b',borderRadius:99,overflow:'hidden'}},
              el('div',{style:{height:'100%',width:p.progress+'%',background:p.color,borderRadius:99}}),
            ),
          ),
          el('div',{style:{display:'flex',gap:5,flexWrap:'wrap',marginBottom:8}},
            (p.tags||'').split(',').map(function(t){return t.trim();}).filter(Boolean).map(function(t){return pill(t,p.color);})
          ),
          el('div',{style:{fontSize:11,color:'#64748b'}},'✅ '+pt.filter(function(t){return t.done;}).length+'/'+pt.length+' 任務 · 💡 '+getProjectIdeas(p.id).length+' 靈感'),
        );
        card.addEventListener('click',function(){set({selectedId:p.id,view:'detail'});});
        return card;
      })
    ),
    el('div',{style:{fontSize:16,fontWeight:800,marginBottom:12,color:'#fff'}},'🔥 高優先待辦'),
    highPri.length===0
      ? el('div',{style:{color:'#475569',fontSize:13}},'沒有高優先待辦，太棒了！')
      : el('div',{},highPri.map(function(t){
          return el('div',{cls:'card',style:{padding:'11px 15px',display:'flex',alignItems:'center',gap:10,marginBottom:8}},
            el('div',{cls:'dot',style:{background:t.pc}}),
            el('span',{style:{fontSize:12,color:t.pc,fontWeight:700,minWidth:56}},t.pn),
            el('span',{style:{fontSize:13.5,color:'#e2e8f0',flex:1}},t.content),
            bdg('高優先','#ef4444'),
          );
        }))
  );
}

function renderDetail(){
  var p=S.projects.find(function(x){return x.id===S.selectedId;});
  if(!p) return el('div',{style:{color:'#64748b'}},'請先選擇一個專案');
  var ptodos=getProjectTodos(p.id);
  var pideas=getProjectIdeas(p.id);
  var dirty=hasDirty();
  var statusSel=el('select',{cls:'inp',style:{width:'auto'}});
  Object.keys(STATUS).forEach(function(k){
    var opt=document.createElement('option');
    opt.value=k; opt.textContent=STATUS[k].label;
    if(k===p.status) opt.selected=true;
    statusSel.appendChild(opt);
  });
  statusSel.addEventListener('change',function(e){updateProject(p.id,{status:e.target.value});});
  var pctLabel=el('span',{style:{fontWeight:800,color:p.color,fontSize:18,minWidth:36}},p.progress+'%');
  var slider=el('input',{type:'range',min:0,max:100,value:p.progress,style:{flex:1,accentColor:p.color}});
  slider.addEventListener('input',function(e){pctLabel.textContent=e.target.value+'%';});
  slider.addEventListener('change',function(e){updateProject(p.id,{progress:+e.target.value});});
  var todoInp=el('input',{cls:'inp',placeholder:'輸入任務內容...'});
  todoInp.value=S.newTodoText;
  todoInp.addEventListener('input',function(e){S.newTodoText=e.target.value;});
  var addTodoBtn=btn('+ 新增','#6366f1',function(){addTodo(p.id,S.newTodoText);},S.saving);
  todoInp.addEventListener('keydown',function(e){if(e.key==='Enter')addTodoBtn.click();});
  var ideaInp=el('input',{cls:'inp',placeholder:'新靈感 / 功能構想...'});
  ideaInp.value=S.newIdeaText;
  ideaInp.addEventListener('input',function(e){S.newIdeaText=e.target.value;});
  var addIdeaBtn=btn('💡 記下','#f59e0b',function(){addIdea(p.id,S.newIdeaText);},S.saving);
  ideaInp.addEventListener('keydown',function(e){if(e.key==='Enter')addIdeaBtn.click();});
  return el('div',{},
    el('div',{style:{display:'flex',alignItems:'center',gap:12,marginBottom:20,flexWrap:'wrap'}},
      el('div',{cls:'dot',style:{background:p.color,width:11,height:11}}),
      el('div',{},
        el('div',{style:{fontSize:20,fontWeight:800,color:'#fff'}},p.name),
        el('div',{style:{fontSize:12,color:'#64748b'}},p.subtitle),
      ),
      el('div',{style:{marginLeft:'auto',display:'flex',gap:8,flexWrap:'wrap'}},statusSel,
        btn('🤖 問 AI','#6366f1',function(){set({aiProjectId:p.id,view:'ai',chatMessages:[{role:'assistant',text:'已載入「'+p.name+'」。\n可以問我：\n• 下一步先做什麼？\n• 幫我整理 TODO\n• 這個功能怎麼實作？'}]});}),
      ),
    ),
    el('div',{cls:'card'},
      el('div',{cls:'sec-title'},'整體進度'),
      el('div',{style:{display:'flex',alignItems:'center',gap:14}},slider,pctLabel),
    ),
    el('div',{cls:'card'},
      el('div',{cls:'sec-title'},'任務清單'),
      dirty?el('div',{cls:'save-bar'},
        el('span',{style:{fontSize:13,color:'#f59e0b'}},'✏️ 有未儲存的變更'),
        btn('✓ 儲存變更','#10b981',saveTodos,S.saving),
      ):null,
      ptodos.map(function(t){
        var cb=el('input',{type:'checkbox',style:{marginTop:3,accentColor:p.color}});
        cb.checked=t.done;
        cb.addEventListener('change',function(){
          S.localTodos[t.id]=!t.done;
          S.dirtyTodos[t.id]=true;
          render();
        });
        return el('div',{cls:'todo-row'},cb,
          el('span',{style:{flex:1,fontSize:13.5,color:t.done?'#475569':'#e2e8f0',textDecoration:t.done?'line-through':'none'}},
            t.content,
            t.isDirty?el('span',{style:{color:'#f59e0b',fontSize:11,marginLeft:6}},'●'):null,
          ),
          bdg(PRI_LABEL[t.priority]||t.priority,PRI_COLOR[t.priority]||'#64748b'),
        );
      }),
      el('div',{style:{marginTop:14,paddingTop:14,borderTop:'1px solid #1e293b'}},
        el('div',{cls:'sec-title'},'新增任務'),
        el('div',{cls:'row'},todoInp,addTodoBtn),
      ),
    ),
    el('div',{cls:'card'},
      el('div',{cls:'sec-title'},'💡 靈感 / 想法'),
      pideas.length===0?el('div',{style:{color:'#475569',fontSize:13,marginBottom:10}},'還沒有靈感，快記下來！'):null,
      pideas.map(function(i){
        return el('div',{cls:'idea-item',style:{borderLeft:'2px solid '+p.color,marginBottom:6}},
          el('div',{style:{fontSize:13.5,color:'#e2e8f0'}},i.content),
          el('div',{style:{fontSize:11,color:'#475569',marginTop:3}},new Date(i.created_at).toLocaleString('zh-TW')),
        );
      }),
      el('div',{style:{marginTop:10}},
        el('div',{cls:'sec-title'},'新增靈感'),
        el('div',{cls:'row'},ideaInp,addIdeaBtn),
      ),
    ),
  );
}

function renderAI(){
  var projects=S.projects;
  var aiProjectId=S.aiProjectId;
  var chatMessages=S.chatMessages;
  var chatLoading=S.chatLoading;
  setTimeout(function(){var e=document.getElementById('chat-bottom');if(e)e.scrollIntoView();},50);
  var chatInp=el('input',{cls:'inp',placeholder:aiProjectId?'問關於「'+(S.projects.find(function(p){return p.id===aiProjectId;})||{name:''}).name+'」的問題...':'問任何問題...'});
  chatInp.value=S.chatInput;
  chatInp.addEventListener('input',function(e){S.chatInput=e.target.value;});
  chatInp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey)sendChat();});
  var projBtns=[el('button',{cls:'nb'+(aiProjectId?'':' active')},'全部')];
  projBtns[0].addEventListener('click',function(){set({aiProjectId:null,chatMessages:[{role:'assistant',text:'你好！選擇一個專案，或直接問我任何問題。'}]});});
  projects.forEach(function(p){
    var b=el('button',{cls:'nb'+(aiProjectId===p.id?' active':''),style:{background:aiProjectId===p.id?p.color:'transparent',color:aiProjectId===p.id?'#fff':'#64748b'}},p.name);
    b.addEventListener('click',function(){set({aiProjectId:p.id,chatMessages:[{role:'assistant',text:'已載入「'+p.name+'」。\n可以問我：\n• 下一步先做什麼？\n• 幫我整理 TODO'}]});});
    projBtns.push(b);
  });
  return el('div',{style:{display:'flex',flexDirection:'column',height:'calc(100vh - 130px)'}},
    el('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}},
      el('div',{style:{fontSize:20,fontWeight:800,color:'#fff'}},'🤖 AI 助理（Gemini）'),
      projBtns,
    ),
    el('div',{cls:'card',style:{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',padding:0}},
      el('div',{cls:'chat-msgs',id:'chat-msgs'},
        chatMessages.map(function(m){return el('div',{cls:'bubble '+(m.role==='user'?'user':'ai')},m.text);}),
        chatLoading?el('div',{cls:'dots'},[0,1,2].map(function(i){return el('div',{cls:'dot-bounce',style:{animation:'bounce 1s '+i*0.2+'s infinite'}});})):null,
        el('div',{id:'chat-bottom'}),
      ),
      el('div',{cls:'chat-input-row'},chatInp,btn('送出','#6366f1',sendChat,chatLoading)),
    ),
  );
}

function renderIdeas(){
  var gIdeas=getGlobalIdeas();
  var analysis=S.ideaAnalysis;
  var ta=el('textarea',{cls:'inp',placeholder:'輸入任何新想法、靈感、構思...',rows:3,style:{resize:'none',marginBottom:10}});
  ta.value=S.globalText||'';
  ta.addEventListener('input',function(e){S.globalText=e.target.value;});
  var analyzeBtn=btn(S.ideaAnalyzing?'🤔 AI 分析中...':'💡 記下 + AI 分析','#6366f1',function(){analyzeIdea(S.globalText);},S.ideaAnalyzing||S.saving);
  var saveOnlyBtn=btn('只記下','#334155',function(){addIdea(null,S.globalText);},S.saving);

  var analysisCard=null;
  if(analysis){
    var actionContent=null;
    if(analysis.action==='new_project'){
      var existingProj=S.projects.find(function(p){return p.name===analysis.project_name;});
      actionContent=el('div',{},
        el('div',{style:{background:'#1e293b',borderRadius:10,padding:'12px 14px',marginBottom:12}},
          el('div',{style:{fontSize:11,color:'#64748b',marginBottom:6}},'建議新建專案'),
          el('div',{style:{fontSize:15,fontWeight:700,color:'#fff',marginBottom:2}},analysis.project_name||''),
          el('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:8}},analysis.project_subtitle||''),
          analysis.suggested_todos&&analysis.suggested_todos.length?el('div',{},
            el('div',{style:{fontSize:11,color:'#64748b',marginBottom:4}},'建議初始任務'),
            analysis.suggested_todos.map(function(t){return el('div',{style:{fontSize:13,color:'#e2e8f0',padding:'3px 0'}},'• '+t);}),
          ):null,
        ),
        el('div',{style:{display:'flex',gap:8}},
          btn('✓ 建立這個專案','#10b981',function(){createFromAnalysis(analysis);}),
          btn('取消','#334155',function(){set({ideaAnalysis:null});}),
        ),
      );
    } else if(analysis.action==='add_to_existing'){
      var targetProj=S.projects.find(function(p){return p.id===analysis.existing_project_id;});
      actionContent=el('div',{},
        el('div',{style:{background:'#1e293b',borderRadius:10,padding:'12px 14px',marginBottom:12}},
          el('div',{style:{fontSize:11,color:'#64748b',marginBottom:6}},'建議加入既有專案'),
          el('div',{style:{fontSize:15,fontWeight:700,color:'#fff',marginBottom:8}},targetProj?targetProj.name:analysis.existing_project_id||''),
          analysis.suggested_todos&&analysis.suggested_todos.length?el('div',{},
            el('div',{style:{fontSize:11,color:'#64748b',marginBottom:4}},'建議新增任務'),
            analysis.suggested_todos.map(function(t){return el('div',{style:{fontSize:13,color:'#e2e8f0',padding:'3px 0'}},'• '+t);}),
          ):null,
        ),
        el('div',{style:{display:'flex',gap:8}},
          btn('✓ 加入這個專案','#10b981',function(){createFromAnalysis(analysis);}),
          btn('取消','#334155',function(){set({ideaAnalysis:null});}),
        ),
      );
    } else {
      actionContent=el('div',{style:{color:'#94a3b8',fontSize:13}},'已記錄為靈感筆記');
    }
    analysisCard=el('div',{cls:'analysis-card'},
      el('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:10}},
        el('span',{style:{fontSize:16}},'🤖'),
        el('div',{style:{fontWeight:700,color:'#fff'}},'AI 分析結果'),
      ),
      el('div',{style:{fontSize:14,color:'#e2e8f0',marginBottom:6}},analysis.summary||''),
      el('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:12}},analysis.reason||''),
      actionContent,
    );
  }

  return el('div',{},
    el('div',{style:{fontSize:20,fontWeight:800,marginBottom:18,color:'#fff'}},'💡 靈感 × AI'),
    el('div',{cls:'card'},
      el('div',{cls:'sec-title'},'新靈感輸入'),
      ta,
      el('div',{style:{display:'flex',gap:8}},analyzeBtn,saveOnlyBtn),
    ),
    analysisCard,
    gIdeas.length>0?el('div',{cls:'card'},
      el('div',{cls:'sec-title'},'未分配靈感'),
      gIdeas.map(function(i){
        return el('div',{cls:'idea-item',style:{borderLeft:'2px solid #f59e0b',marginBottom:6}},
          el('div',{style:{fontSize:13.5,color:'#e2e8f0'}},i.content),
          el('div',{style:{fontSize:11,color:'#475569',marginTop:3}},new Date(i.created_at).toLocaleString('zh-TW')),
        );
      }),
    ):null,
    S.projects.filter(function(p){return getProjectIdeas(p.id).length>0;}).map(function(p){
      return el('div',{cls:'card'},
        el('div',{cls:'sec-title',style:{color:p.color}},p.name+' 的靈感'),
        getProjectIdeas(p.id).map(function(i){
          var isEditing2=S.editingIdeaId===i.id;
          if(isEditing2){
            var ei2=el('input',{cls:'inp',style:{marginBottom:8}});
            ei2.value=S.editingIdeaText;
            ei2.addEventListener('input',function(e){S.editingIdeaText=e.target.value;});
            ei2.addEventListener('keydown',function(e){if(e.key==='Enter')updateIdea(i.id,S.editingIdeaText);if(e.key==='Escape')set({editingIdeaId:null});});
            return el('div',{cls:'idea-item',style:{borderLeft:'2px solid '+p.color,marginBottom:6}},
              ei2,
              el('div',{style:{display:'flex',gap:6}},
                btn('儲存','#10b981',function(){updateIdea(i.id,S.editingIdeaText);}),
                btn('取消','#334155',function(){set({editingIdeaId:null});}),
              ),
            );
          }
          return el('div',{cls:'idea-item',style:{borderLeft:'2px solid '+p.color,marginBottom:6,display:'flex',alignItems:'flex-start',gap:8}},
            el('div',{style:{flex:1}},
              el('div',{style:{fontSize:13.5,color:'#e2e8f0'}},i.content),
              el('div',{style:{fontSize:11,color:'#475569',marginTop:3}},new Date(i.created_at).toLocaleString('zh-TW')),
            ),
            el('div',{style:{display:'flex',gap:4,flexShrink:0}},
              (function(ii,ic){var b=el('button',{style:{background:'none',border:'none',color:'#64748b',cursor:'pointer',fontSize:14,padding:'2px 5px'}},'✏️');b.addEventListener('click',function(){set({editingIdeaId:ii,editingIdeaText:ic});});return b;})(i.id,i.content),
              (function(ii){var b=el('button',{style:{background:'none',border:'none',color:'#475569',cursor:'pointer',fontSize:14,padding:'2px 5px'}},'🗑️');b.addEventListener('click',function(){if(confirm('確定刪除？'))deleteIdea(ii);});return b;})(i.id),
            ),
          );
        }),
      );
    }),
  );
}

// Main render
function render(){
  var app=document.getElementById('app');
  app.innerHTML='';
  var loading=S.loading,error=S.error,projects=S.projects,selectedId=S.selectedId,view=S.view,saving=S.saving,showNewProj=S.showNewProj,newProj=S.newProj,globalText=S.globalText;

  if(loading){
    app.appendChild(el('div',{cls:'loading-screen'},el('div',{cls:'spinner'}),el('div',{style:{color:'#64748b'}},'正在連線 Cloudflare D1...')));
    return;
  }
  if(error&&!projects.length){
    app.appendChild(el('div',{cls:'loading-screen'},
      el('div',{style:{fontSize:32}},'⚠️'),
      el('div',{style:{fontSize:16,color:'#ef4444'}},error),
      btn('重試','#6366f1',loadData),
    ));
    return;
  }

  app.appendChild(el('header',{},
    el('div',{},
      el('div',{cls:'logo'},'⚡ 專案指揮中心'),
      el('div',{cls:'logo-sub'},saving?'⟳ 儲存中...':'✓ Cloudflare D1 · '+projects.length+' 個專案'),
    ),
    el('nav',{},
      [['board','看板'],['detail','詳情'],['ai','🤖 AI'],['ideas','💡 靈感 × AI']].map(function(item){
        var b=el('button',{cls:'nb'+(view===item[0]?' active':'')},item[1]);
        b.addEventListener('click',function(){set({view:item[0]});});
        return b;
      }),
      (function(){var b=el('button',{cls:'nb',title:'重新整理'},'↻');b.addEventListener('click',loadData);return b;})(),
    ),
  ));

  var body=el('div',{cls:'body'});
  var sb=el('div',{cls:'sidebar'});
  sb.appendChild(el('div',{cls:'sec-title'},'我的專案'));
  projects.forEach(function(p){
    var pt=getProjectTodos(p.id);
    var isActive=selectedId===p.id;
    var card=el('div',{cls:'proj-card',style:{background:isActive?p.color+'22':'transparent',border:'1px solid '+(isActive?p.color+'55':'transparent')}},
      el('div',{style:{display:'flex',alignItems:'center',gap:7,marginBottom:3}},
        el('div',{cls:'dot',style:{background:p.color}}),
        el('span',{style:{fontSize:13,fontWeight:700,color:'#f1f5f9'}},p.name),
      ),
      el('div',{cls:'progress-bar'},el('div',{cls:'progress-fill',style:{width:p.progress+'%',background:p.color}})),
      el('div',{style:{display:'flex',justifyContent:'space-between',paddingLeft:14}},
        bdg((STATUS[p.status]&&STATUS[p.status].label)||p.status,(STATUS[p.status]&&STATUS[p.status].color)||'#64748b'),
        el('span',{style:{fontSize:11,color:'#64748b'}},pt.filter(function(t){return t.done;}).length+'/'+pt.length),
      ),
    );
    card.addEventListener('click',function(){set({selectedId:p.id,view:'detail'});});
    sb.appendChild(card);
  });
  var apb=el('button',{cls:'btn',style:{background:'#1e293b',color:'#94a3b8',width:'100%',marginTop:4}},'+ 新增專案');
  apb.addEventListener('click',function(){set({showNewProj:true});});
  sb.appendChild(apb);
  var gta=el('textarea',{cls:'inp',placeholder:'任何新想法...',rows:2,style:{resize:'none',marginBottom:8}});
  gta.value=globalText||'';
  gta.addEventListener('input',function(e){S.globalText=e.target.value;});
  sb.appendChild(el('div',{style:{marginTop:18,paddingTop:14,borderTop:'1px solid #1e293b'}},
    el('div',{cls:'sec-title'},'⚡ 快速記靈感'),
    gta,
    btn('記下來 💡','#f59e0b',function(){addIdea(null,S.globalText);},saving),
  ));
  body.appendChild(sb);

  var main=el('div',{cls:'main'});
  if(view==='board') main.appendChild(renderBoard());
  if(view==='detail') main.appendChild(renderDetail());
  if(view==='ai') main.appendChild(renderAI());
  if(view==='ideas') main.appendChild(renderIdeas());
  body.appendChild(main);
  app.appendChild(body);

  // 手機底部導覽列
  var bnav=el('div',{cls:'bottom-nav'});
  [['board','看板','🗂️'],['detail','詳情','📋'],['ai','AI','🤖'],['ideas','靈感','💡']].forEach(function(item){
    var b=el('button',{cls:view===item[0]?'active':''},el('span',{cls:'bnav-icon'},item[2]),document.createTextNode(item[1]));
    b.addEventListener('click',function(){set({view:item[0]});});
    bnav.appendChild(b);
  });
  app.appendChild(bnav);

  if(showNewProj){
    var fields=[{l:'專案名稱',k:'name',p:'例：API 整合系統'},{l:'副標題',k:'subtitle',p:'例：FastAPI + PostgreSQL'},{l:'標籤（逗號分隔）',k:'tags',p:'例：Python, React'}];
    app.appendChild(el('div',{cls:'modal-bg'},
      el('div',{cls:'modal'},
        el('div',{style:{fontSize:17,fontWeight:800,color:'#fff',marginBottom:16}},'新增專案'),
        fields.map(function(f){
          return el('div',{style:{marginBottom:10}},
            el('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:4}},f.l),
            (function(){var i=el('input',{cls:'inp',placeholder:f.p});i.value=newProj[f.k];i.addEventListener('input',function(e){S.newProj[f.k]=e.target.value;});return i;})(),
          );
        }),
        el('div',{style:{marginBottom:14}},
          el('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:4}},'顏色'),
          (function(){var i=el('input',{type:'color'});i.value=newProj.color;i.addEventListener('input',function(e){S.newProj.color=e.target.value;});return i;})(),
        ),
        el('div',{cls:'row'},
          btn('建立','#6366f1',function(){
            if(!S.newProj.name.trim()) return;
            addProject({name:S.newProj.name,subtitle:S.newProj.subtitle,tags:S.newProj.tags,color:S.newProj.color,status:'active',progress:0});
          },saving),
          btn('取消','#334155',function(){set({showNewProj:false});}),
        ),
      ),
    ));
  }
}

render();
loadData();
</script>
</body>
</html>
